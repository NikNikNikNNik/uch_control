# Запуск с PostgreSQL:  docker compose up -d --build
# Перед запуском скопируйте .env.example в .env и задайте пароли и ключ.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://training:${POSTGRES_PASSWORD}@db:5432/training
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:

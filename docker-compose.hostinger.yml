services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      SQLITE_FILE: /app/data/training.db
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      SEED_DEMO: "0"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
